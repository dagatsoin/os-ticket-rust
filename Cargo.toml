[workspace]
resolver = "2"
members = [
    "backend/api",
    "backend/core",
    "backend/db",
]

# Shared dependency versions for the osTicket modernisation backend workspace.
# Pinned to the Rust 1.87 stable toolchain (sqlx 0.8.x line).
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-2.0"
repository = "local"

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
http = "1"
