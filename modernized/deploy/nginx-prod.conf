# =============================================================================
# nginx-prod.conf — os-ticket.warfog.gg (osTicket modernised)
# =============================================================================
# Serves the built React SPA (static) and reverse-proxies /api/* to the Rust
# Axum backend on 127.0.0.1:3701.
#
#  HTTP-ONLY AT COMMIT TIME.
# On first install this file is copied to /etc/nginx/sites-available/os-ticket.conf
# and symlinked into sites-enabled. The operator then runs certbot ONCE:
#
#     sudo certbot --nginx -d os-ticket.warfog.gg
#
# certbot EDITS THE INSTALLED FILE IN PLACE — it adds `listen 443 ssl;`,
# `ssl_certificate*` directives and an HTTP->HTTPS redirect server block. The
# committed repo copy stays HTTP-only; the on-VPS file is the post-certbot
# source of truth. deploy.sh preserves an installed file that already has TLS
# (it does not clobber certbot's edits — see deploy.sh).
#
# Validate syntax locally without installing nginx:
#     docker run --rm -v "$PWD/modernized/deploy/nginx-prod.conf:/etc/nginx/conf.d/test.conf:ro" \
#       nginx:1.27 nginx -t
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name os-ticket.warfog.gg;

    # Built SPA lives in the runtime dir (rsynced from this repo's
    # modernized/frontend/dist). Adjust if the runtime path changes.
    root /home/debian/apps/runtime/os-ticket-prod/dist;
    index index.html;

    # Uploads: lift the default 1m so attachment uploads succeed. The backend
    # still enforces its own max_file_size (config key), this is just the edge.
    client_max_body_size 25m;

    # --- API reverse proxy --------------------------------------------------
    # ^~ takes precedence over the SPA `location /` try_files fallback, so
    # /api/* is always proxied to the backend and never rewritten to index.html.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3701;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Static assets: long-cache the fingerprinted bundle -----------------
    # Vite emits content-hashed filenames under /assets, so they are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback -------------------------------------------------------
    # Any non-file route serves index.html so client-side routing works on
    # deep links / refresh. index.html itself must NOT be cached.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
