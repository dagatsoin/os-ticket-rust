[package]
name = "ost_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ammonia = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
# TS-M1-A4b — DB-backed sessions + group-permission lookup (session/permission
# modules) and structured logging for the stub mailer.
sqlx = { workspace = true }
tracing = { workspace = true }
# TS-M2-A1 — SHA-256 filesystem blob store (content addressing + async file I/O).
sha2 = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
# TS-M2-E1 — real SMTP transport behind the mailer port (ROADMAP M2 §4).
lettre = { workspace = true }
# TS-M3-I1 — Date/time parsing for due date validation.
chrono = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# TS-M1-A4b — DB-backed session integration tests (against TEST_DATABASE_URL).
db = { path = "../db" }
tokio = { workspace = true }
# TS-M2-E2 — Mailpit REST API assertions for the send wrappers (skip-pass when
# MAILPIT_URL is unset, ROADMAP M2 §5).
reqwest = { workspace = true }
